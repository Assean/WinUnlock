name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate
      - name: Build Unsigned App
        working-directory: ios
        run: |
          xcodebuild -project WinUnlock.xcodeproj \
            -scheme WinUnlock \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/WinUnlock.app Payload/
          zip -r WinUnlock.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WinUnlock-iOS-IPA
          path: ios/WinUnlock.ipa
